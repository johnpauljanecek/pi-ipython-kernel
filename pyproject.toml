[project]
name = "ipyforge-kernel-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jupyter-client>=8.6.0",
    "ipykernel>=6.29.0",
    "jupyter-console>=6.6.3",
    "pydantic>=2.0.0",
    "pyzmq>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
